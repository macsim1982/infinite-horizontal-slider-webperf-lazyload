  <body>
    <div
      class="js-slider-wrapper slider-wrapper product-tile"

    >
      <div class="js-next nav next">next</div>
      <div class="js-prev nav prev">prev</div>
      <div class="js-slider slider">
        <img
          class="item"
          src="https://picsum.photos/id/10/500/700"
          alt=""
          loading="lazy"
          decoding="async"
          width="500"
          height="700"
        />
      </div>

      <div class="js-indicators indicators">
        <div class="js-indicator indicator"></div>
